services:
  postgres:
    image: postgres:16-alpine
    container_name: authsystem-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-authdb}
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_user} -d ${POSTGRES_DB:-authdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: authsystem-api
    environment:
      # Dentro da rede do Compose, o banco é alcançado pelo nome do serviço, não por localhost.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-authdb}
      DB_USER: ${DB_USER:-auth_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Endereço da API visto pelo navegador (porta publicada no host).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: authsystem-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
